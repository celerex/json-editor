<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8"/>
		<meta name="viewport" content="width=device-width, initial-scale=1"/>
		<title>JSON Editor Playground</title>
		<link
			rel="stylesheet"
			href="https://cdn.jsdelivr.net/gh/celerex/json-editor@master/dist/editor.css"/>
		<link
			rel="stylesheet"
			href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.css"/>
		<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/javascript/javascript.min.js"></script>
	</head>
	<body>
		<h1>JSON Editor Playground</h1>
		<section class="panel" id="editor-playground"></section>
		<section class="panel">
			<h2>JSON</h2>
			<div id="playground-json" class="code-editor"></div>
			<div id="playground-json-error" class="je-error"></div>
			<div class="code-actions">
				<button id="apply-json" type="button">Apply JSON</button>
			</div>
		</section>
		<section class="panel">
			<h2>Schema</h2>
			<div id="playground-schema" class="code-editor"></div>
			<div id="playground-schema-error" class="je-error"></div>
			<div class="code-actions">
				<button id="apply-schema" type="button">Apply Schema</button>
			</div>
		</section>
		<style>
			:root {
				--je-panel-bg: #fff9ef;
				--je-panel-border: #d7c9b8;
				--je-panel-shadow: rgba(30, 27, 22, 0.08);
				--je-panel-radius: 12px;
				--je-text-primary: #1e1b16;
			}

			body {
				margin: 0;
				padding: 24px;
				display: grid;
				gap: 20px;
				grid-template-columns: minmax(320px, 1fr) minmax(280px, 1fr);
				color-scheme: light;
				font-family: var(--je-font-family, "IBM Plex Sans", "Segoe UI", sans-serif);
				background: var(--je-page-bg, #f5f2ea);
			}

			h1 {
				grid-column: 1 / -1;
				margin: 0;
				font-weight: 600;
				color: var(--je-text-primary);
			}

			.panel {
				background: var(--je-panel-bg);
				border: 1px solid var(--je-panel-border);
				border-radius: var(--je-panel-radius);
				padding: 16px;
				box-shadow: 0 6px 20px var(--je-panel-shadow);
			}

			#editor-playground {
				min-height: 400px;
			}

			pre {
				margin: 0;
				white-space: pre-wrap;
				font-size: 12px;
			}

			button {
				padding: 6px 10px;
				border-radius: var(--je-input-radius);
				border: 1px solid var(--je-button-border);
				background: var(--je-button-bg);
				cursor: pointer;
			}

			button:disabled {
				opacity: var(--je-disabled);
				cursor: not-allowed;
			}

			.code-editor {
				height: 280px;
				border: 1px solid var(--je-panel-border);
				border-radius: 8px;
				overflow: hidden;
				background: var(--je-panel-bg);
			}

			.code-editor .CodeMirror {
				height: 100%;
				font-family: "IBM Plex Mono", "SFMono-Regular", Menlo, monospace;
				font-size: 12px;
				line-height: 1.5;
				background: var(--je-panel-bg);
				color: var(--je-text-primary);
			}

			.code-editor .CodeMirror-gutters {
				background: var(--je-panel-bg);
				border-right: 0;
				color: var(--je-text-muted);
			}

			.code-actions {
				margin-top: 10px;
				display: flex;
				gap: 8px;
			}

			@media (max-width: 900px) {
				body {
					grid-template-columns: 1fr;
				}
			}
		</style>
		<script type="module">
			import { createDomEditor } from "https://cdn.jsdelivr.net/gh/celerex/json-editor@master/dist/editor.esm.js";
			const storedJson = window.localStorage.getItem("json-editor-playground-json")
			const storedSchema = window.localStorage.getItem("json-editor-playground-schema")
			const initialJson = storedJson ? JSON.parse(storedJson) : { name: "json-editor", status: "active" }
			const defaultSchema = {
				title: "Profile",
				description: "Structured profile data with nested settings.",
				type: "object",
				required: ["name", "status"],
				properties: {
					name: { type: "string", title: "Name", description: "Display name shown in the product UI." },
					status: {
						enum: ["active", "paused", "archived"],
						title: "Status",
						description: "Controls availability and visibility."
					},
					age: {
						type: "number",
						minimum: 0,
						title: "Age",
						description: "Minimum 0, used for eligibility."
					},
					birthday: {
						type: "string",
						format: "date",
						title: "Birthday",
						description: "Use YYYY-MM-DD."
					},
					newsletter: { type: "boolean", title: "Newsletter", description: "Receive product updates by email." },
					contact: {
						title: "Contact",
						description: "Primary contact details.",
						type: "object",
						required: ["email"],
						properties: {
							email: {
								type: "string",
								format: "email",
								title: "Email",
								description: "Main inbox for notifications."
							},
							phone: { type: "string", title: "Phone", description: "Optional support number." },
							contactTime: {
								type: "string",
								format: "time",
								title: "Best Time",
								description: "Local time, HH:MM."
							}
						},
						additionalProperties: false
					},
					tags: {
						title: "Tags",
						description: "Free-form labels for search and grouping.",
						type: "array",
						items: { type: "string" }
					},
					notes: {
						title: "Notes",
						description: "Either a short string or a structured note.",
						oneOf: [{ type: "string", title: "Plain", description: "Single line note." }, {
							type: "object",
							title: "Structured",
							description: "Expandable note object.",
							properties: { summary: { type: "string", description: "Short summary." } }
						}],
						"ui:widget": "textarea"
					},
					preferences: {
						title: "Preferences",
						description: "Display and layout choices.",
						type: "object",
						properties: {
							theme: { const: "light", title: "Theme", description: "Locked to light for now." },
							layout: { enum: ["dense", "cozy", "spacious"], title: "Layout", description: "UI spacing preset." }
						},
						additionalProperties: { type: "string" }
					}
				},
				additionalProperties: false
			}
			const initialSchema = storedSchema ? JSON.parse(storedSchema) : defaultSchema
			const jsonEditor = window.CodeMirror(
				document
						.querySelector("#playground-json"),
				{
					value: JSON.stringify(initialJson, null, 2),
					mode: { name: "javascript", json: true },
					lineNumbers: true,
					lineWrapping: true,
					indentUnit: 2,
					tabSize: 2,
					indentWithTabs: true,
					extraKeys: { Tab: "indentMore", "Shift-Tab": "indentLess" }
				}
			)
			const schemaEditor = window.CodeMirror(
				document
						.querySelector("#playground-schema"),
				{
					value: JSON.stringify(initialSchema, null, 2),
					mode: { name: "javascript", json: true },
					lineNumbers: true,
					lineWrapping: true,
					indentUnit: 2,
					tabSize: 2,
					indentWithTabs: true,
					extraKeys: { Tab: "indentMore", "Shift-Tab": "indentLess" }
				}
			)
			const jsonError = document.querySelector("#playground-json-error")
			const schemaError = document.querySelector("#playground-schema-error")
			const editor = createDomEditor(
				{
					container: document.querySelector("#editor-playground"),
					value: initialJson,
					schema: initialSchema,
					lenient: false,
					defaultCollapsed: true,
					onChange(next) {
						const nextText = JSON.stringify(next, null, 2)
						const current = jsonEditor.getValue()
						if (current !== nextText) jsonEditor.setValue(nextText)
						window.localStorage.setItem("json-editor-playground-json", JSON.stringify(next))
					}
				}
			)
			document.querySelector("#apply-json")
				.addEventListener(
					"click",
					() => {
						try {
							const raw = jsonEditor.getValue()
							const parsed = raw.trim() === "" ? null : JSON.parse(raw)
							jsonError.textContent = ""
							window.localStorage.setItem("json-editor-playground-json", JSON.stringify(parsed))
							editor.setValue(parsed)
						}
						catch (error) {
							jsonError.textContent = error instanceof Error ? error.message : "Invalid JSON"
						}
					}
				)
			document.querySelector("#apply-schema")
				.addEventListener(
					"click",
					() => {
						try {
							const raw = schemaEditor.getValue()
							const parsed = raw.trim() === "" ? null : JSON.parse(raw)
							schemaError.textContent = ""
							window.localStorage.setItem("json-editor-playground-schema", JSON.stringify(parsed))
							editor.setSchema(parsed)
						}
						catch (error) {
							schemaError.textContent = error instanceof Error ? error.message : "Invalid schema"
						}
					}
				)
		</script>
	</body>
</html>
